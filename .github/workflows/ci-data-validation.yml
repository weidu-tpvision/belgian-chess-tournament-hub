name: CI — Data & Build Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Tournament Data & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate tournament seed data
        run: node scripts/verify-tournaments.mjs --report-file data-validation-report.md

      - name: Publish validation summary
        if: always() && hashFiles('data-validation-report.md') != ''
        run: cat data-validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build
