name: Scheduled — Tournament Sync & Accuracy Audit

on:
  schedule:
    # Every Monday at 06:00 UTC (07:00/08:00 Brussels time)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tournament-accuracy-audit
  cancel-in-progress: false

jobs:
  sync-and-audit:
    name: Sync Federation Sources, Audit Links & Open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync live Belgian federation feeds into src/data/tournaments.json
        run: |
          node scripts/sync-tournaments.mjs \
            --report-file sync-report.md \
            --json-file sync-summary.json

      - name: Check if tournament catalog changed
        id: diff
        run: |
          if git diff --quiet src/data/tournaments.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run static + live tournament accuracy check
        id: verify
        continue-on-error: true
        run: |
          node scripts/verify-tournaments.mjs --live \
            --report-file accuracy-report.md \
            --json-file accuracy-summary.json

      - name: Verify TypeScript & Next.js build when catalog changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run build

      - name: Publish combined report to Job Summary
        if: always()
        run: |
          if [ -f sync-report.md ]; then
            cat sync-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f accuracy-report.md ]; then
            cat accuracy-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit synced catalog and open/update Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execSync } = require('node:child_process');

            const syncSummary = JSON.parse(fs.readFileSync('sync-summary.json', 'utf-8'));
            const syncReport = fs.readFileSync('sync-report.md', 'utf-8');
            const accuracyReport = fs.existsSync('accuracy-report.md')
              ? fs.readFileSync('accuracy-report.md', 'utf-8')
              : '';

            const branchName = 'chore/sync-tournaments';
            const labelName = 'automated-sync';
            const prTitle = `chore(data): sync Belgian chess tournaments (seed v${syncSummary.newSeedVersion})`;

            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync(`git checkout -B ${branchName}`);
            execSync('git add src/data/tournaments.json');
            execSync(
              `git commit -m "chore(data): sync Belgian chess tournaments (seed v${syncSummary.newSeedVersion})"`
            );
            execSync(`git push --force origin ${branchName}`);

            // Ensure label exists
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0e8a16',
                description: 'Automated tournament catalog sync pull requests',
              });
            } catch (err) {
              if (err.status !== 422) core.info(`Skipping label creation: ${err.message}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prBody = [
              syncReport,
              '---',
              accuracyReport,
              '---',
              `✅ Static data validation, TypeScript typecheck, and Next.js production build passed on this branch.`,
              `_Automated run: [GitHub Actions Run #${context.runNumber}](${runUrl})_`,
            ].join('\n\n');

            const { data: openPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branchName}`,
              base: 'main',
            });

            if (openPrs.length > 0) {
              const pr = openPrs[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: prTitle,
                body: prBody,
              });
              core.info(`Updated existing sync PR #${pr.number}.`);
            } else {
              const { data: created } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: branchName,
                base: 'main',
                body: prBody,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: created.number,
                labels: [labelName],
              });
              core.info(`Created sync PR #${created.number}.`);
            }

      - name: Create, update, or close accuracy audit issue
        if: always() && hashFiles('accuracy-summary.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const summary = JSON.parse(fs.readFileSync('accuracy-summary.json', 'utf-8'));
            const report = fs.readFileSync('accuracy-report.md', 'utf-8');
            const issueTitle = '[Data Accuracy] Belgian Chess Tournament Audit';
            const labelName = 'data-accuracy';

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: 'd93f0b',
                description: 'Automated tournament data & link accuracy alerts',
              });
            } catch (err) {
              if (err.status !== 422) {
                core.info(`Skipping label creation: ${err.message}`);
              }
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labelName,
              per_page: 20,
            });

            const existing = openIssues.find((i) => i.title === issueTitle);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const footer = `\n---\n_Automated run: [GitHub Actions Run #${context.runNumber}](${runUrl})_`;

            if (summary.errorCount > 0 || summary.warningCount > 0) {
              const body = `${report}${footer}`;
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                core.info(`Updated existing audit issue #${existing.number}.`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  labels: [labelName],
                  body,
                });
                core.info(`Created new audit issue #${created.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ Latest scheduled accuracy audit passed with **0 errors** and **0 warnings**. Closing this issue automatically.${footer}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
              core.info(`Closed resolved audit issue #${existing.number}.`);
            } else {
              core.info('All checks passed and no open audit issue exists.');
            }

      - name: Fail job if hard errors were detected
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Tournament accuracy audit detected hard errors (static validation failure or HTTP 404/410 dead links). See Job Summary or Issue for details."
          exit 1
